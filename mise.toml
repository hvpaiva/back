min_version = "2026.3.7"

[tools]
just = "1.58.0"
kind = "0.33.0"
# Matches the cluster's Kubernetes minor (see cluster/kind.yaml).
kubectl = "1.35.8"
helm = "4.3.0"
# Matches the Argo CD version installed by `just argocd`.
argocd = "3.5.2"
crossplane = "2.5.0"
aws-cli = "2.36.43"
jq = "1.8.2"

[env]
# Isolation: here, kubectl and helm only see the lab cluster (kubeconfig in .kube/, git-ignored).
KUBECONFIG = "{{config_root}}/.kube/config"

# The argocd CLI keeps its login in .argocd/ and reaches the server through Traefik over plain HTTP.
ARGOCD_OPTS = "--config {{config_root}}/.argocd/config --grpc-web --plaintext"

# AWS calls from here go to LocalStack, whatever credentials or profiles exist elsewhere.
AWS_ENDPOINT_URL = "http://localhost:4566"
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"
AWS_REGION = "us-east-1"
