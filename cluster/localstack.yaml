# LocalStack stands in for AWS.
#
# The Community edition ended on 2026-03-23: newer images require an account and an
# auth token, and the free plan is for non-commercial use only. 4.14.0 is the last
# Community release. It runs without a token, but it is frozen (no updates, no
# security patches), which is acceptable for a local lab and nothing else.
#
# State lives in memory: restarting the pod wipes every bucket and queue. Crossplane
# notices and recreates what it manages.
apiVersion: v1
kind: Namespace
metadata:
  name: localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
          ports:
            - name: edge
              containerPort: 4566
          env:
            # Don't send usage analytics to LocalStack.
            - name: DISABLE_EVENTS
              value: "1"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
---
# Reachable at localstack.localstack.svc:4566 from pods and at localhost:4566 from the host.
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
      nodePort: 31566
