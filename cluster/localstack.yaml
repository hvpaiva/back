# 4.14.0 is the last Community release: later images need an auth token. It gets no
# updates or security patches. State is in memory; a restart wipes every resource.
apiVersion: v1
kind: Namespace
metadata:
  name: localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
          ports:
            - name: edge
              containerPort: 4566
          env:
            # No usage analytics.
            - name: DISABLE_EVENTS
              value: "1"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
---
# localstack.localstack.svc:4566 in the cluster, localhost:4566 on the host.
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
      nodePort: 31566
