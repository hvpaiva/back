# Traefik is the lab's entry point. It serves both classic Ingress and Gateway API,
# so the platform can move services from one to the other without touching the cluster.

# kind has no load balancer; these node ports are mapped to the host in kind.yaml.
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

providers:
  # Ingress objects. The chart also creates the default IngressClass "traefik".
  kubernetesIngress:
    enabled: true
    # Write this address into every Ingress's status, as a cloud load balancer
    # would. Argo CD reports an Ingress as Healthy only once it has an address.
    # publishedService would copy the address of Traefik's own Service instead,
    # and a NodePort Service has none.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
  # Gateway API (HTTPRoute and friends). The chart creates a GatewayClass and a Gateway.
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      # Accept HTTPRoutes from every namespace, not only from traefik's own.
      namespacePolicy:
        from: All

# Dashboard at http://traefik.localhost/dashboard/.
# Fine for a local lab; never expose it like this on a real network.
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`)
    entryPoints: ["web"]
