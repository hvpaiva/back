# kind has no load balancer: fixed node ports, mapped to the host in kind.yaml.
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

providers:
  kubernetesIngress:
    enabled: true
    # Argo CD keeps an Ingress Progressing until its status has an address, which no
    # load balancer fills in here. publishedService would copy the NodePort's empty one.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      # HTTPRoutes from every namespace, not only traefik's.
      namespacePolicy:
        from: All

# Unauthenticated dashboard: acceptable on 127.0.0.1 only.
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`)
    entryPoints: ["web"]
