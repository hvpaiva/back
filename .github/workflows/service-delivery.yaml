# Delivery for services: validates charts/<service>/ on pull requests, builds and
# deploys on staging, promotes on main. Deploying is a commit to the stage's values
# file; Argo CD does the rest. Callers grant `contents: write` and `packages: write`.
name: service-delivery

on:
  workflow_call:
    inputs:
      service:
        description: The folder under charts/ that describes the service
        type: string
        required: true
      platform-repository:
        description: Where the platform's chart lives
        type: string
        default: hvpaiva/back
      platform-ref:
        description: The platform version to validate against (what Argo CD deploys with)
        type: string
        default: main
      language:
        description: Picks the platform's Dockerfile, build/<language>.Dockerfile
        type: string
        default: go
      dockerfile:
        description: The service's own Dockerfile, to use instead of the platform's
        type: string
        default: ""

permissions: {}

env:
  CHART_DIR: charts/${{ inputs.service }}
  SERVICE: ${{ inputs.service }}

jobs:
  # A broken values file would also stop the ApplicationSet for every service.
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          path: .platform
          persist-credentials: false
      - name: Render the chart for each stage
        run: |
          status=0
          for stage in staging production; do
            args=(--values "$CHART_DIR/values.yaml")
            if [[ -f $CHART_DIR/values-$stage.yaml ]]; then
              args+=(--values "$CHART_DIR/values-$stage.yaml")
            fi
            for route in ingress gateway; do
              if errors=$(helm template "$SERVICE" .platform/charts/app "${args[@]}" \
                --set "platform.stage=$stage" --set "platform.route=$route" 2>&1 >/dev/null); then
                echo "$stage on $route: ok"
              else
                status=1
                printf '%s on %s: %s\n' "$stage" "$route" "$errors" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit $status

  # staging builds unless the push only touched charts/ or docs; main promotes only when the push changed
  # staging's image, so reverting a promotion isn't undone. A run started by hand has no push to read, so
  # it does whichever its branch is for.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          build=false
          promote=false
          known=false
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then known=true; fi
          if [[ $BRANCH == staging ]]; then
            if ! $known || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^(charts|docs)/|\.md$'; then
              build=true
            fi
          elif [[ $BRANCH == main ]]; then
            now=$(yq '.image' "$CHART_DIR/values-staging.yaml")
            before=none
            if $known; then before=$(git show "$BEFORE:$CHART_DIR/values-staging.yaml" | yq '.image'); fi
            if [[ $now != "$before" ]]; then promote=true; fi
          fi
          echo "build=$build promote=$promote"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

  staging:
    needs: [validate, plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the commits since the last one, so this needs them and their tags.
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          path: .platform
          persist-credentials: false

      - name: Pick the version
        id: version
        run: echo "version=$(.platform/scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile || format('.platform/build/{0}.Dockerfile', inputs.language) }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The version the image carries, on the commit it was built from. Tags pushed with the workflow's own
      # token don't start new runs.
      - name: Mark the commit with the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "$SERVICE $VERSION is already this commit's version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" --message "$SERVICE $VERSION"
          git push origin "v$VERSION"

      - name: Deploy to staging
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          yq -i '.image = strenv(IMAGE) + ":" + strenv(VERSION)' "$CHART_DIR/values-staging.yaml"
          if git diff --quiet; then
            echo "staging already runs $VERSION"
            exit 0
          fi
          git commit -am "chore($SERVICE): deploy $VERSION to staging"
          git pull --rebase origin staging
          git push origin HEAD:staging

  production:
    needs: [validate, plan]
    if: needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote the image staging ran
        run: |
          IMAGE=$(yq '.image' "$CHART_DIR/values-staging.yaml")
          export IMAGE
          yq -i '.image = strenv(IMAGE)' "$CHART_DIR/values-production.yaml"
          if git diff --quiet; then
            echo "production already runs $IMAGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore($SERVICE): promote ${IMAGE##*:} to production"
          git pull --rebase origin main
          git push origin HEAD:main
