# Also used by `just argocd` for the first install.

global:
  domain: argocd.localhost

configs:
  cm:
    # No webhooks reach a local cluster: poll Git every 60s (chart default: 120s + 60s jitter).
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 10s
    ui.bannercontent: "BACK lab"
    # Lets root wait for each wave of Applications to be healthy; off by default since 1.8.
    resource.customizations.health.argoproj.io_Application: |
      local hs = {status = "Progressing", message = ""}
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      return hs
    # Argo CD has no check for the platform's own kinds, one key per kind: ConfigMap keys can't hold `*`.
    resource.customizations.health.back.lab_Bucket: |
      local ready, synced
      for _, c in ipairs(obj.status and obj.status.conditions or {}) do
        if c.type == "Ready" then ready = c end
        if c.type == "Synced" then synced = c end
      end
      if synced ~= nil and synced.status == "False" then
        return {status = "Degraded", message = synced.message or synced.reason}
      end
      if ready ~= nil and ready.status == "True" then
        return {status = "Healthy"}
      end
      return {status = "Progressing", message = ready and (ready.message or ready.reason) or "Waiting for Crossplane"}
    # The built-in check says Degraded while a provider starts, failing its sync.
    resource.customizations.health.pkg.crossplane.io_Provider: |
      local installed, healthy = false, false
      local message = "Waiting for the provider to be installed"
      for _, c in ipairs(obj.status and obj.status.conditions or {}) do
        if c.type == "Installed" then installed = c.status == "True" end
        if c.type == "Healthy" then healthy = c.status == "True" end
        if c.status ~= "True" then message = c.message ~= "" and c.message or c.reason end
      end
      if installed and healthy then
        return {status = "Healthy"}
      end
      return {status = "Progressing", message = message}
    # Crossplane's bookkeeping, one per managed resource.
    resourceExclusionsAdditional:
      - apiGroups: ["*"]
        kinds: [ProviderConfigUsage]
  params:
    # Traefik serves plain HTTP.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik

dex:
  enabled: false

# The GitHub App's credentials Secret comes from `just notifications`, never from Git.
notifications:
  argocdUrl: http://argocd.localhost
  secret:
    create: false
  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey
  # The services: the ApplicationSet labels them with their stage.
  subscriptions:
    - recipients:
        - github
      selector: stage
      triggers:
        - on-deployed
        - on-degraded
        - on-sync-failed
  triggers:
    trigger.on-deployed: |
      - description: A new version is synced and healthy
        oncePer: app.status.sync.revisions[1]
        when: app.status.operationState != nil and app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
        send: [github-success]
    trigger.on-degraded: |
      - description: The running version stopped being healthy
        when: app.status.health.status == 'Degraded'
        send: [github-failure]
    trigger.on-sync-failed: |
      - description: The new version couldn't be applied
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [github-failure]
  # Source 1 is the service's repository (0 is the platform's chart). With autoMerge
  # on, GitHub would try to merge the default branch into the deployed one.
  templates:
    template.github-success: |
      message: "{{ .app.metadata.name }} is synced and healthy"
      github:
        repoURLPath: "{{ (index .app.spec.sources 1).repoURL }}"
        revisionPath: "{{ index .app.status.sync.revisions 1 }}"
        status:
          state: success
          label: "argocd/{{ .app.metadata.name }}"
          targetURL: "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}"
        deployment:
          state: success
          environment: "{{ .app.metadata.labels.stage }}"
          environmentURL: 'http://{{ (index .app.spec.sources 0).helm.releaseName }}{{ if ne .app.metadata.labels.stage "production" }}.{{ .app.metadata.labels.stage }}{{ end }}.localhost'
          logURL: "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    template.github-failure: |
      message: "{{ .app.metadata.name }}: sync {{ .app.status.operationState.phase }}, health {{ .app.status.health.status }}"
      github:
        repoURLPath: "{{ (index .app.spec.sources 1).repoURL }}"
        revisionPath: "{{ index .app.status.sync.revisions 1 }}"
        status:
          state: failure
          label: "argocd/{{ .app.metadata.name }}"
          targetURL: "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}"
        deployment:
          state: failure
          environment: "{{ .app.metadata.labels.stage }}"
          logURL: "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
