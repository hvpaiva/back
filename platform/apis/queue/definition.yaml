apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: queues.back.lab
spec:
  group: back.lab
  names:
    kind: Queue
    plural: queues
  scope: Namespaced
  defaultCompositionRef:
    name: queue-sqs
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: QUEUE
          type: string
          jsonPath: .status.queueName
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                fifo:
                  type: boolean
                  default: false
                  description: Deliver messages in the order they were sent, each one once.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A queue can't switch between standard and FIFO once it exists.
                visibilityTimeoutSeconds:
                  type: integer
                  minimum: 0
                  maximum: 43200
                  default: 30
                  description: How long a message stays hidden from other consumers once received. Longer than it takes to process one.
            status:
              type: object
              properties:
                queueName:
                  type: string
                  description: The queue's name in SQS.
