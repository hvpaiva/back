apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: buckets.back.lab
spec:
  group: back.lab
  names:
    kind: Bucket
    plural: buckets
  scope: Namespaced
  defaultCompositionRef:
    name: bucket-s3
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: BUCKET
          type: string
          jsonPath: .status.bucketName
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                versioning:
                  type: boolean
                  default: false
                  description: Keep every version of every object.
            status:
              type: object
              properties:
                bucketName:
                  type: string
                  description: The bucket's name in S3.
