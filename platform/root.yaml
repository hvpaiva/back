# The app of apps, and the only Application applied by hand (`just argocd`
# does it). It delivers every manifest in platform/apps/, including the
# Application through which Argo CD manages itself. It stays in the built-in
# `default` project because it is what creates the `platform` project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hvpaiva/back.git
    targetRevision: main
    path: platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
