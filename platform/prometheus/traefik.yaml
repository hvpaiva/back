# Traefik comes with the base layer, outside Argo CD, so what reads its metrics comes with Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
spec:
  namespaceSelector:
    matchNames:
      - traefik
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      # A canary lasts about a minute, and the check that judges it needs two readings before it says anything.
      interval: 10s
