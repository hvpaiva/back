# Restarts a service when a Secret the platform composed for it changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.17
      helm:
        valuesObject:
          reloader:
            # The default strategy adds an env var to the pod template, which self-heal takes back out.
            reloadStrategy: annotations
            isArgoRollouts: true
            # Watching every namespace means reading every Secret in the cluster, Argo CD's included.
            watchGlobally: false
            namespaces:
              - hello-staging
              - hello-production
            # Granted by platform/reloader and, in each service's namespace, by the service's chart.
            rbac:
              enabled: false
    - repoURL: https://github.com/hvpaiva/back.git
      targetRevision: main
      path: platform/reloader
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
