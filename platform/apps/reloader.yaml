# Restarts a service when a Secret the platform composed for it changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.17
    helm:
      valuesObject:
        reloader:
          # The default strategy adds an env var to the pod template, which self-heal takes back out.
          reloadStrategy: annotations
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
