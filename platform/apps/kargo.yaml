# Moves a version from one stage to the next, and writes what each one runs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    # Its webhooks' certificates are cert-manager kinds, which don't exist until wave 0 is done.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.11.4
    helm:
      valuesObject:
        api:
          host: kargo.localhost
          # Projects, credentials and everything else come from Git, so the API server never writes a Secret.
          secretManagementEnabled: false
          secret:
            # Generated by just identities, since a password hash and a signing key can't live in Git.
            name: kargo-admin
          tls:
            enabled: false
          ingress:
            enabled: true
            ingressClassName: traefik
            tls:
              enabled: false
        externalWebhooksServer:
          # Nothing outside this machine can reach the lab, so warehouses poll instead of being told.
          enabled: false
        global:
          # Deprecated by the chart, and only cluster-scoped webhook receivers use it.
          createClusterSecretsNamespace: false
          createClusterSecretsRBAC: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
