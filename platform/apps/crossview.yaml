apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossview
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://crossplane-contrib.github.io/crossview
      chart: crossview
      targetRevision: 4.6.0
      helm:
        valuesObject:
          # It keeps sessions in Postgres, and the lab has no accounts to keep.
          database:
            enabled: false
          config:
            server:
              auth:
                mode: none
          # Its ClusterRole reads everything in the cluster; platform/crossview has a narrower one.
          rbac:
            create: false
          ingress:
            enabled: true
            className: traefik
            # The chart's defaults here are nginx's redirect annotations, which Traefik ignores.
            annotations: {}
            hosts:
              - host: crossview.localhost
                paths:
                  - path: /
                    pathType: Prefix
    - repoURL: https://github.com/hvpaiva/back.git
      targetRevision: main
      path: platform/crossview
  destination:
    server: https://kubernetes.default.svc
    namespace: crossview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
