apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Components run by the platform team
  # Every new third-party chart repository has to be listed here.
  sourceRepos:
    - https://github.com/hvpaiva/back.git
    - https://argoproj.github.io/argo-helm
    - https://kubernetes-sigs.github.io/headlamp/
    - https://charts.crossplane.io/stable
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Services run by product teams
  sourceRepos:
    - https://github.com/hvpaiva/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-staging"
    - server: https://kubernetes.default.svc
      namespace: "*-production"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: "*-staging"
    - group: ""
      kind: Namespace
      name: "*-production"
