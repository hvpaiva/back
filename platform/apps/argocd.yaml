apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd          
spec:
  project: platform
  sources:
    # 1. The manifests: the argo-cd Helm chart
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd           
      targetRevision: 10.8.4  
      helm:
        releaseName: argocd  
        valueFiles:
          - $values/platform/argocd/values.yaml   
    # 2. The values: our repo, referenced by name, not applied
    - repoURL: https://github.com/hvpaiva/back.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc   
    namespace: argocd    
  syncPolicy:
    automated:
      prune: true       
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
