apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/hvpaiva/back.git
    targetRevision: main
    path: platform/apis
    directory:
      recurse: true
      # Each API ships an example request, for rendering and for trying it out by hand.
      exclude: "**/example.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Deleting an XRD deletes every request made through it.
      prune: false
      selfHeal: true
