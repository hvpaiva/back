# What Reloader may do where it watches; each service's chart binds it in that service's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reloader
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [list, get, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [list, get, update, patch]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [list, get, update, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list, get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, list, get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader
  namespace: reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reloader
subjects:
  - kind: ServiceAccount
    name: reloader-reloader
    namespace: reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader-metadata
  namespace: reloader
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, get, watch, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader-metadata
  namespace: reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reloader-metadata
subjects:
  - kind: ServiceAccount
    name: reloader-reloader
    namespace: reloader
