# Crossplane manages managed resources and the core kinds it runs packages with. Any other
# kind a Composition creates needs a grant here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-compose
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  # Database
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups]
    verbs: ["*"]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: ["*"]
