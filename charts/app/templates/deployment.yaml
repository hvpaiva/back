{{- $size := include "app.size" . | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.application.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $size.replicas }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.application.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: APP_ENV
              value: {{ .Values.platform.stage }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # What the service asked for, as the platform resolved it. A service
            # can show these, so editing its values.yaml is visible from outside.
            - name: APP_SIZE
              value: {{ .Values.size | quote }}
            - name: APP_REPLICAS
              value: {{ $size.replicas | quote }}
            - name: APP_CPU
              value: {{ $size.cpu | quote }}
            - name: APP_MEMORY
              value: {{ $size.memory | quote }}
            - name: APP_MEMORY_LIMIT
              value: {{ $size.memoryLimit | quote }}
            - name: APP_PUBLIC
              value: {{ .Values.public | quote }}
            {{- if kindIs "map" .Values.bucket }}
            - name: BUCKET_VERSIONING
              value: {{ .Values.bucket.versioning | default false | quote }}
            {{- end }}
          {{- if kindIs "map" .Values.bucket }}
          envFrom:
            - secretRef:
                name: {{ .Values.application.name }}-bucket
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ $size.cpu }}
              memory: {{ $size.memory }}
            limits:
              memory: {{ $size.memoryLimit }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
