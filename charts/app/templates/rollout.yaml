{{- $size := include "app.size" . | fromJson }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.application.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ $size.replicas }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  strategy:
    canary:
      {{- if and .Values.public (eq .Values.platform.route "gateway") }}
      stableService: {{ .Values.application.name }}
      canaryService: {{ .Values.application.name }}-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ .Values.application.name }}
      {{- end }}
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.application.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: APP_ENV
              value: {{ .Values.platform.stage }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # What the service asked for, as the platform resolved it: a service can show it, so a values change is visible.
            - name: APP_SIZE
              value: {{ .Values.size | quote }}
            - name: APP_REPLICAS
              value: {{ $size.replicas | quote }}
            - name: APP_CPU
              value: {{ $size.cpu | quote }}
            - name: APP_MEMORY
              value: {{ $size.memory | quote }}
            - name: APP_MEMORY_LIMIT
              value: {{ $size.memoryLimit | quote }}
            - name: APP_PUBLIC
              value: {{ .Values.public | quote }}
            {{- if kindIs "map" .Values.bucket }}
            - name: BUCKET_VERSIONING
              value: {{ .Values.bucket.versioning | default false | quote }}
            {{- end }}
            {{- if kindIs "map" .Values.database }}
            - name: DATABASE_SIZE
              value: {{ .Values.database.size | default "small" | quote }}
            {{- end }}
          {{- if or (kindIs "map" .Values.bucket) (kindIs "map" .Values.database) }}
          envFrom:
            {{- if kindIs "map" .Values.bucket }}
            - secretRef:
                name: {{ include "app.connection" (dict "kind" "bucket" "name" (.Values.bucket.name | default "bucket")) }}
            {{- end }}
            {{- if kindIs "map" .Values.database }}
            - secretRef:
                name: {{ include "app.connection" (dict "kind" "database" "name" (.Values.database.name | default "database")) }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ $size.cpu }}
              memory: {{ $size.memory }}
            limits:
              memory: {{ $size.memoryLimit }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
