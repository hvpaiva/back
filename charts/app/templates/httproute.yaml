{{- if and .Values.public (eq .Values.platform.route "gateway") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.application.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - {{ include "app.host" . }}
  rules:
    # Argo Rollouts sets these during a canary.
    - backendRefs:
        - name: {{ .Values.application.name }}
          port: 80
          weight: 100
        - name: {{ .Values.application.name }}-canary
          port: 80
          weight: 0
{{- end }}
