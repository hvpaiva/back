# What a service declares, in charts/<service>/values.yaml and values-<stage>.yaml
# of its repository. values.schema.json rejects anything else.

application:
  # Names its objects, its namespace and its address.
  name: ""
  # Can read the service's namespaces, as the Kubernetes group of that name.
  team: ""

# Written into values-<stage>.yaml by the delivery workflow on every deploy.
image: ""

# Must answer GET /healthz.
port: 8080

# small, medium or large; see _helpers.tpl.
size: small

# Serve at http://<name>.<stage>.localhost (http://<name>.localhost in production).
public: false

# An S3 bucket: `{}`, or `versioning: true` to keep every version of each object.
# Its name and credentials reach the service as BUCKET_NAME and AWS_* variables.
bucket: null

# Set by the platform's ApplicationSet, never by services.
platform:
  stage: staging
  domain: localhost
